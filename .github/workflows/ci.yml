name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-react

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: my-react/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Check frontend types and lint
        run: npm run typecheck && npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Check public JavaScript budget
        run: npm run check:bundle

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run mocked workflows and visual regression
        run: npm run test:e2e

      - name: Assert builds leave source unchanged
        run: git diff --exit-code

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports-${{ github.run_id }}
          path: |
            my-react/playwright-report/
            my-react/test-results/

  backend:
    name: Backend and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Temurin Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Docker is available
        run: docker info

      - name: Compile and run unit, Flyway, and PostgreSQL integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: Production artifact and live browser scenarios
    needs:
      - frontend
      - backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: worksheet-ci-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: my-react/package-lock.json

      - name: Install browser-test dependencies
        working-directory: my-react
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify Docker and Compose
        run: |
          docker info
          docker compose version

      - name: Build production stack and run both live suites
        run: npm run test:live
        env:
          CI: "true"

      - name: Upload live failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-browser-reports-${{ github.run_id }}
          path: |
            my-react/playwright-report/
            my-react/test-results/
